apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: taskboard
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: taskboard
spec:
  type: NodePort # доступ з хоста: minikube service web -n taskboard
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
