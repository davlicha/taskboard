worker_processes auto;
events { worker_connections 1024; }

http {
  log_format lb '$remote_addr "$request" $status upstream=$upstream_addr '
                'upstream_status=$upstream_status rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log lb;

  # Пул екземплярів. Алгоритм за замовчуванням — round robin.
  # max_fails/fail_timeout — пасивна перевірка: після 1 невдачі сервер виключається на 10 с.
  upstream items_backend {
    server 172.28.0.11:8000 max_fails=1 fail_timeout=10s;  # app1
    server 172.28.0.12:8000 max_fails=1 fail_timeout=10s;  # app2
    server 172.28.0.13:8000 max_fails=1 fail_timeout=10s;  # app3
    keepalive 16;
  }

  server {
    listen 80;

    location = /nginx-health { return 200 "ok\n"; }

    location / {
      proxy_pass http://items_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Якщо екземпляр недоступний — повторити запит на наступному
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_connect_timeout 500ms;
      proxy_read_timeout 15s;

      add_header X-Upstream $upstream_addr always;
    }
  }
}
