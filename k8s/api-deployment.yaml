apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: taskboard
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: taskboard
  annotations:
    kubernetes.io/change-cause: "api 1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # під час оновлення завжди є готові поди
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: taskboard
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/davlicha/taskboard-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            # даємо kube-proxy / ingress прибрати под з Endpoints до зупинки процесу
            preStop:
              exec: { command: ["sleep", "5"] }
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
