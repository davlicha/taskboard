{{- if not .Values.postgres.auth.existingSecret }}
{{- $name := include "taskboard.dbSecretName" . }}
{{- $password := .Values.postgres.auth.password }}
{{- if not $password }}
  {{- /* Пароль не задано: беремо з уже існуючого секрету або генеруємо випадковий */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $existing $existing.data }}
    {{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 24 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "taskboard.labels" (dict "root" . "component" "db") | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.postgres.auth.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | b64enc | quote }}
{{- end }}
