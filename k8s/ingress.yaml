# Потрібне доповнення: minikube addons enable ingress
# Додати в /etc/hosts:  127.0.0.1 taskboard.local  (і запустити `minikube tunnel`)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard
  namespace: taskboard
  labels:
    app.kubernetes.io/part-of: taskboard
spec:
  ingressClassName: nginx
  rules:
    - host: taskboard.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { name: http } }
          - path: /version
            pathType: Exact
            backend:
              service: { name: api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
