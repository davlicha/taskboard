# ЛР-9: 3 екземпляри застосунку + nginx як балансувальник; LocalStack емулює DynamoDB (і CloudWatch для ЛР-10).
#   docker compose up -d --build
#   через балансувальник: http://localhost:8080      напряму (без балансування): http://localhost:8001
name: lab9

x-app: &app
  build:
    context: ..
    dockerfile: lab09-load-balancing/app/Dockerfile
  image: lab9-items-app:1.0.0
  environment: &app-env
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: us-east-1
    TABLE_NAME: items
    WORK_MS: ${WORK_MS:-20}
    METRICS_ENABLED: ${METRICS_ENABLED:-false} # ЛР-10
    FLUSH_SECONDS: "10"
  depends_on:
    localstack:
      condition: service_healthy
  restart: "no"

services:
  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb,cloudwatch,sns,sts
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 2s
      retries: 30
    networks:
      lbnet:
        ipv4_address: 172.28.0.5

  app1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-1 }
    ports: ["8001:8000"] # прямий доступ — для порівняння "без балансування"
    networks: { lbnet: { ipv4_address: 172.28.0.11 } }

  app2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-2 }
    networks: { lbnet: { ipv4_address: 172.28.0.12 } }

  app3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-3 }
    networks: { lbnet: { ipv4_address: 172.28.0.13 } }

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [app1, app2, app3]
    networks: { lbnet: { ipv4_address: 172.28.0.2 } }

networks:
  lbnet:
    ipam:
      config:
        - subnet: 172.28.0.0/24
