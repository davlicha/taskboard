{{- if .Values.ingress.enabled }}
{{- $api := include "taskboard.componentName" (dict "root" . "component" "api") }}
{{- $web := include "taskboard.componentName" (dict "root" . "component" "web") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taskboard.fullname" . }}
  labels:
    {{- include "taskboard.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: {{ $api }}, port: { name: http } }
          - path: /version
            pathType: Exact
            backend:
              service: { name: {{ $api }}, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $web }}, port: { name: http } }
{{- end }}
