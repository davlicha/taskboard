apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.componentName" (dict "root" . "component" "web") }}
  labels:
    {{- include "taskboard.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "taskboard.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePort }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
